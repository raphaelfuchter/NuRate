<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Câmbio Cartão</title>
    <meta name="description" content="Quanto sua compra em libra ou peso colombiano custa em reais no Nubank Ultravioleta ou na Conta Global">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#008c93">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Câmbio ➤ Real</h1></header>

<main>
    <div class="tabs" role="radiogroup" aria-label="Moeda">
        <label><input type="radio" name="moeda" value="GBP" checked> £ Libra</label>
        <label><input type="radio" name="moeda" value="COP"> $ Peso colombiano</label>
    </div>

    <div class="tabs" role="radiogroup" aria-label="Modalidade">
        <label><input type="radio" name="modo" value="uv" checked> Ultravioleta (crédito)</label>
        <label><input type="radio" name="modo" value="cg"> Conta Global</label>
    </div>

    <div class="valores">
        <label class="moeda"><span id="simbolo">£</span><input type="text" inputmode="decimal" id="valor" autocomplete="off"></label>
        <label class="moeda"><span>R$</span><input type="text" id="brl" readonly></label>
    </div>

    <label class="check" id="box-saque" hidden><input type="checkbox" id="saque"> Incluir taxa de saque</label>

    <div id="vars">
        <label>Cotação (R$)<input type="text" inputmode="decimal" id="cotacao"></label>
        <label>Spread (%)<input type="text" inputmode="decimal" id="spread"></label>
        <label>IOF (%)<input type="text" inputmode="decimal" id="iof"></label>
        <label id="lbl-taxa" hidden>Taxa saque (R$)<input type="text" inputmode="decimal" id="taxa"></label>
    </div>

    <p id="status"></p>
    <p id="nota"></p>
    <button type="button" id="padrao">Restaurar taxas padrão</button>
</main>

<script src="calc.js"></script>
<script src="script.js"></script>
</body>
</html>
